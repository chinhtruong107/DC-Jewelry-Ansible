[control_node]
# This repository is executed on the Terraform-created Control Node.
control-node ansible_connection=local

[k3s_server]
# Replace with Terraform's K3s Server private IP (Public subnet 1).
k3s-server-1 ansible_host=REPLACE_K3S_SERVER_PRIVATE_IP

[k3s_workers]
# Add every private worker Terraform creates in private subnet 1.
k3s-worker-1 ansible_host=REPLACE_K3S_WORKER_1_PRIVATE_IP
k3s-worker-2 ansible_host=REPLACE_K3S_WORKER_2_PRIVATE_IP

[k3s_cluster:children]
k3s_server
k3s_workers

[k3s_cluster:vars]
ansible_user=ubuntu
# Copy Terraform's private key to this path on the Control Node and chmod 600 it.
ansible_ssh_private_key_file=/home/ubuntu/.ssh/dcjewelry-k3s.pem
ansible_python_interpreter=/usr/bin/python3
