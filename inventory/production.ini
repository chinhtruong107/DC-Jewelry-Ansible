[frontend]
# Replace with the Frontend private IP from the Terraform deployment.
frontend-1 ansible_host=REPLACE_FRONTEND_PRIVATE_IP

[backend]
# Replace with the Backend private IP from the Terraform deployment.
backend-1 ansible_host=REPLACE_BACKEND_PRIVATE_IP

[jewelry_servers:children]
frontend
backend

[jewelry_servers:vars]
ansible_user=ubuntu
ansible_ssh_private_key_file=/home/ubuntu/.ssh/key
ansible_python_interpreter=/usr/bin/python3
