---
# Pin this to a tested K3s release before production use.
k3s_version: "v1.33.5+k3s1"

# Terraform topology: K3s Server is public; agents stay in private subnet 1.
# Both server and workers use VPC private addresses for cluster traffic.
k3s_server_private_ip: REPLACE_K3S_SERVER_PRIVATE_IP
k3s_api_port: 6443

control_node_user: ubuntu
control_node_kubeconfig_path: "/home/{{ control_node_user }}/.kube/config"

# Binaries installed on the Control Node for operating the cluster.
kubectl_version: "v1.33.5"
helm_version: "v3.17.3"
tool_architecture: amd64
