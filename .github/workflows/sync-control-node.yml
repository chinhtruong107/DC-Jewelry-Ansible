name: Sync Ansible Control Node

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync:
    name: Pull K3s bootstrap code on Control Node
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure SSH
        env:
          CONTROL_NODE_SSH_KEY: ${{ secrets.CONTROL_NODE_SSH_KEY }}
          CONTROL_NODE_HOST: ${{ secrets.CONTROL_NODE_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$CONTROL_NODE_SSH_KEY" > ~/.ssh/control.pem
          chmod 700 ~/.ssh
          chmod 600 ~/.ssh/control.pem
          ssh-keyscan -H "$CONTROL_NODE_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Update repository and validate the bootstrap playbook
        env:
          CONTROL_NODE_HOST: ${{ secrets.CONTROL_NODE_HOST }}
          CONTROL_NODE_USER: ${{ secrets.CONTROL_NODE_USER }}
        run: |
          ssh -i ~/.ssh/control.pem -o IdentitiesOnly=yes -o ConnectTimeout=30 \
            "$CONTROL_NODE_USER@$CONTROL_NODE_HOST" '
              set -e
              REPO_DIR="/home/ubuntu/dc-jewelry-ansible"
              if [ ! -d "$REPO_DIR/.git" ]; then
                git clone git@github.com:chinhtruong107/DC-Jewelry-Ansible.git "$REPO_DIR"
              fi
              cd "$REPO_DIR"
              git fetch origin main
              git checkout main
              git reset --hard origin/main
              chmod +x scripts/bootstrap-k3s.sh
              ansible-inventory --graph
              ansible-playbook playbooks/site.yml --syntax-check
            '

# This workflow only syncs and syntax-checks code. Bootstrap changes hosts and
# remains a deliberate command on the Control Node.
