---
- name: Deploy Duc Chinh Jewelry services
  hosts: jewelry_servers
  become: false
  gather_facts: false

  tasks:
    - name: Check project directory
      ansible.builtin.stat:
        path: "{{ project_dir }}"
      register: project_directory

    - name: Stop deployment if project directory does not exist
      ansible.builtin.fail:
        msg: "Project directory {{ project_dir }} does not exist."
      when: not project_directory.stat.exists

    - name: Fetch latest source code
      ansible.builtin.command:
        cmd: git fetch origin "{{ project_branch }}"
        chdir: "{{ project_dir }}"
      changed_when: false
      environment:
        GIT_TERMINAL_PROMPT: "0"

    - name: Configure frontend API endpoint for the private Backend EC2
      ansible.builtin.copy:
        dest: "{{ project_dir }}/compose.override.yml"
        mode: "0644"
        content: |
          services:
            frontend:
              environment:
                LARAVEL_API_URL: http://{{ backend_private_ip }}:8002/api
      when: "'frontend' in group_names"

    - name: Reset source code to latest remote commit
      ansible.builtin.command:
        argv: [git, reset, --hard, "origin/{{ project_branch }}"]
        chdir: "{{ project_dir }}"
      environment:
        GIT_TERMINAL_PROMPT: "0"

    - name: Validate Docker Compose configuration
      ansible.builtin.command:
        cmd: docker compose config --quiet
        chdir: "{{ project_dir }}"
      changed_when: false

    - name: Build and start backend on the private Backend EC2
      ansible.builtin.command:
        cmd: docker compose up -d --build --remove-orphans {{ backend_service }}
        chdir: "{{ project_dir }}"
      when: "'backend' in group_names"

    - name: Run Laravel migrations on the Backend EC2
      ansible.builtin.command:
        cmd: docker compose exec -T {{ backend_service }} php artisan migrate --force
        chdir: "{{ project_dir }}"
      when:
        - run_migrations | bool
        - "'backend' in group_names"

    - name: Clear Laravel caches on the Backend EC2
      ansible.builtin.command:
        cmd: docker compose exec -T {{ backend_service }} php artisan optimize:clear
        chdir: "{{ project_dir }}"
      when: "'backend' in group_names"

    - name: Build and start frontend on the public Frontend EC2
      ansible.builtin.command:
        cmd: docker compose up -d --build --remove-orphans --no-deps {{ frontend_service }}
        chdir: "{{ project_dir }}"
      when: "'frontend' in group_names"

    - name: Wait for frontend port
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: 3002
        delay: 2
        timeout: 120
      when: "'frontend' in group_names"

    - name: Check frontend locally
      ansible.builtin.uri:
        url: "{{ frontend_local_url }}"
        status_code: [200, 301, 302, 307, 308]
        timeout: 30
      register: frontend_health
      retries: 10
      delay: 5
      until: frontend_health.status in [200, 301, 302, 307, 308]
      when: "'frontend' in group_names"

    - name: Wait for backend port
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: 8002
        delay: 2
        timeout: 120
      when: "'backend' in group_names"

    - name: Check backend locally
      ansible.builtin.uri:
        url: "{{ backend_local_url }}"
        status_code: [200, 301, 302, 404]
        timeout: 30
      register: backend_health
      retries: 10
      delay: 5
      until: backend_health.status in [200, 301, 302, 404]
      when: "'backend' in group_names"

    - name: Check public HTTPS website from the Control Node
      ansible.builtin.uri:
        url: "{{ public_url }}"
        status_code: [200, 301, 302, 307, 308]
        validate_certs: true
        timeout: 30
      register: public_health
      retries: 10
      delay: 5
      until: public_health.status in [200, 301, 302, 307, 308]
      delegate_to: localhost
      run_once: true

    - name: Get Docker Compose status
      ansible.builtin.command:
        cmd: docker compose ps
        chdir: "{{ project_dir }}"
      register: compose_status
      changed_when: false

    - name: Display Docker Compose status
      ansible.builtin.debug:
        var: compose_status.stdout_lines
